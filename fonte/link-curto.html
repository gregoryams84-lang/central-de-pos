<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Pós · Polo Anhanguera</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0; url={{URL_PADRAO}}"></noscript>
<script>
{{LOGICA}}
(function () {
  var d = LINK_CURTO.destino('{{WHATSAPP}}', '{{CODIGO}}', location.search);
  var registro = '{{REGISTRO}}';
  if (registro && navigator.sendBeacon) {
    // O clique vai para a planilha sem segurar o redirecionamento: se falhar, a pessoa chega no WhatsApp igual.
    var dados = JSON.stringify({ tipo: 'clique', rede: '{{CAMINHO}}', codigo: d.codigo, pagina: location.pathname + location.search, quando: new Date().toISOString() });
    try { navigator.sendBeacon(registro, new Blob([dados], { type: 'text/plain;charset=utf-8' })); } catch (e) {}
  }
  try { localStorage.setItem('cp_ultimo_codigo', JSON.stringify({ c: d.codigo, em: Date.now() })); } catch (e) {}
  window.__destino = d.url;
  location.replace(d.url);
})();
</script>
<style>body{margin:0;background:#FCFCFC;color:#1D1D1D;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:420px;margin:0 auto;padding:40px 20px}.marca{font-weight:700;margin:0 0 28px}.marca span{color:#F94D12}.botao{display:flex;align-items:center;justify-content:center;min-height:60px;margin:20px 0 16px;border-radius:14px;background:#F94D12;color:#fff;font-weight:700;font-size:1.2rem;text-decoration:none}.nota{color:#555;font-size:.95rem}</style>
</head>
<body>
<main>
<p class="marca">Central de Pós <span>·</span> Polo Anhanguera</p>
<p>Abrindo a conversa com o Manoel no WhatsApp…</p>
<a class="botao" id="link" href="{{URL_PADRAO}}">Abrir o WhatsApp</a>
<p class="nota">Não abriu? Salve o número <strong>{{TELEFONE}}</strong> e chame no WhatsApp.</p>
</main>
<script>try { document.getElementById('link').href = window.__destino; } catch (e) {}</script>
</body>
</html>
