<!DOCTYPE html>
<!-- Molde da imagem de compartilhamento (og.png, 1200x630). Para refazer: servir a pasta do site,
     abrir /fonte/og.html numa janela de 1200x630 e salvar a captura como og.png na raiz. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url('/fontes/montserrat-600.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url('/fontes/montserrat-700.woff2') format('woff2'); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #FCFCFC; color: #1D1D1D; font-family: 'Montserrat', sans-serif; }
  .faixa { position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: #F94D12; }
  .dentro { position: absolute; left: 96px; right: 96px; top: 84px; bottom: 72px; display: flex; flex-direction: column; }
  .marca { font-weight: 700; font-size: 34px; }
  .marca span { color: #F94D12; }
  h1 { font-size: 76px; line-height: 1.08; margin: 54px 0 0; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #F94D12; }
  .rodape { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .fatos { font-weight: 600; font-size: 28px; color: #555; }
  .botao { padding: 20px 34px; border-radius: 18px; background: #F94D12; color: #fff; font-weight: 700; font-size: 30px; }
</style>
</head>
<body>
  <div class="faixa"></div>
  <div class="dentro">
    <p class="marca" style="margin:0">Central de Pós <span>·</span> Polo Anhanguera</p>
    <h1>Pós-graduação online,<br>com <em>gente de verdade</em><br>te atendendo.</h1>
    <div class="rodape">
      <span class="fatos">100% online · 9 áreas · todo o Brasil</span>
      <span class="botao">Fale no WhatsApp</span>
    </div>
  </div>
</body>
</html>
